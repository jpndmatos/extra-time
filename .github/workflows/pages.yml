name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.TOUCHLINE_API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate hosted API
        env:
          API_URL: ${{ vars.TOUCHLINE_API_URL }}
        run: |
          node --input-type=module -e '
            if (!process.env.API_URL) throw new Error("Set repository variable TOUCHLINE_API_URL to the hosted HTTPS .NET API origin first.");
            const url = new URL(process.env.API_URL);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash || ["localhost", "127.0.0.1"].includes(url.hostname)) throw new Error("TOUCHLINE_API_URL must be a public HTTPS origin, not a path, token or localhost URL.");
          '
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - name: Build Pages frontend
        env:
          VITE_API_URL: ${{ vars.TOUCHLINE_API_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm --prefix web run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
