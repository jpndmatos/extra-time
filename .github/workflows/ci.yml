name: Build and verify
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: dotnet test Touchline.sln --configuration Release --nologo
      - name: Install browser verification tools
        run: |
          npm ci
          google-chrome --version
      - name: Start isolated UI verification host
        env:
          DatabasePath: ${{ runner.temp }}/touchline-ui.db
          Reddit__PublicFeedEnabled: "false"
          Reddit__Enabled: "false"
          FootballData__Token: ""
          Logging__LogLevel__Default: Warning
        run: |
          dotnet run --project src/Touchline.Api --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5195 > "$RUNNER_TEMP/touchline-ui.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5195/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5195/api/health
      - name: Verify responsive UI, accessibility and playback recovery
        env:
          TOUCHLINE_BROWSER_CHANNEL: chrome
        run: npm run test:browser
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            docs/workspace.png
            docs/mobile.png
            docs/viewport-*.png
            ${{ runner.temp }}/touchline-ui.log
          retention-days: 7
      - name: Build API container
        run: docker build -t touchline-api .
      - name: Verify API container
        run: |
          docker run -d --name touchline-test -p 8080:8080 \
            -e Reddit__PublicFeedEnabled=false -e Reddit__Enabled=false touchline-api
          trap 'docker logs touchline-test; docker rm -f touchline-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent http://localhost:8080/ | grep 'Extra Time'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/preferences)" = 404
